# Evenstar Writings后端配置模板
# 使用方法：复制本文件为 config.yaml 并填入真实值。config.yaml 已被 .gitignore 忽略，禁止提交。

app:
  name: "Evenstar Writings"
  version: "1.0.0"
  mode: "debug"        # debug / release / test
  port: 8080

database:
  mysql:
    host: "localhost"
    port: 3306
    username: "root"
    password: ""       # 建议走环境变量 MYSQL_PASSWORD
    database: "evenstar"
    max_idle_conns: 10
    max_open_conns: 100
  redis:
    host: "localhost"
    port: 6379
    password: ""       # 建议走环境变量 REDIS_PASSWORD
    db: 0
    pool_size: 10

jwt:
  secret: ""           # 必须修改，建议走环境变量 JWT_SECRET
  expire_hours: 168    # 7 天

log:
  level: "debug"       # debug / info / warn / error
  filename: "logs/app.log"
  max_size: 100        # MB
  max_backups: 3
  max_age: 28          # 天
  compress: true

cors:
  enabled: true
  allow_origins:
    - "http://localhost:5173"   # 前端 dev 服务器
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
  expose_headers: []
  allow_credentials: true
  max_age: 86400

# 阿里云邮件推送（注册/找回密码验证码）
mail:
  mock: true           # true = 不真发邮件，验证码打印到后端日志（开发期）；上线改 false
  host: ""             # SMTP 地址，如 smtpdm.aliyun.com
  port: 465
  username: ""         # SMTP 账号
  password: ""         # 建议走环境变量 MAIL_PASSWORD
  from_addr: ""        # 发信地址
  from_name: "Evenstar Writings"

# 阿里云 OSS（图片存储）
oss:
  endpoint: ""         # 如 oss-cn-hangzhou.aliyuncs.com
  access_key_id: ""
  access_key_secret: "" # 建议走环境变量 OSS_ACCESS_KEY_SECRET
  bucket: ""

# 阿里云验证码 2.0（滑动验证）
captcha:
  scene_id: ""         # 验证场景 ID
  prefix: ""           # 身份标
  access_key_id: ""
  access_key_secret: "" # 建议走环境变量 CAPTCHA_ACCESS_KEY_SECRET
  endpoint: "captcha.cn-shanghai.aliyuncs.com"
