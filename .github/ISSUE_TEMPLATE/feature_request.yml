name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议。请先说明**要解决的场景**，而非直接跳到实现方案。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前遇到的痛点或使用场景
      placeholder: 例如：想给文章加密码访问，但现在只能发布或存草稿，没有中间状态。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望这个功能怎么表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现思路？各自有什么取舍？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 后端 API
        - 前端页面（前台）
        - 前端页面（后台）
        - 部署 / 运维
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复建议
          required: true
        - label: 我愿意自己提交 PR 实现这个功能
          required: false
