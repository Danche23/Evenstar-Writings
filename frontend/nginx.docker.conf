# ===== frontend/nginx.docker.conf =====
# 容器内 nginx 站点配置（挂载到容器 /etc/nginx/conf.d/default.conf）
#
# 2026-09-18 更新：备案通过后接入 HTTPS
#   - 80  → 强制跳转到 https://evenstar.love
#   - 443 → 主站（SSL）
#   - 8080→ 过渡期保留的明文入口（用 IP:8080 仍可访问），确认无需后可删除
#
# 证书挂载：宿主机 ./ssl  →  容器 /etc/nginx/ssl（compose 里配置，只读）
#   即 /var/www/evenstar/ssl/evenstar.love.pem  →  /etc/nginx/ssl/evenstar.love.pem
#      /var/www/evenstar/ssl/evenstar.love.key  →  /etc/nginx/ssl/evenstar.love.key
#
# 与宿主机版 frontend/nginx.conf 的关键差异：
#   root 指向镜像内 dist（/usr/share/nginx/html）；/api 反代到 compose 服务名 backend:8080

# ============ ① 80 端口：全部强制跳转到 HTTPS ============
server {
    listen 80;
    server_name _;

    # 不做内容，只做跳转。目标写死域名，避免用 IP 访问时跳到证书不匹配的地址
    return 301 https://evenstar.love$request_uri;
}

# ============ ② 443 端口：HTTPS 主站 ============
server {
    listen 443 ssl;
    # http2 on 是 nginx 1.25.1+ 的写法（本镜像为 nginx:1.27-alpine，支持）
    http2 on;
    server_name evenstar.love;

    # ---- 证书（阿里云下载的 Nginx 格式：.pem 证书链 + .key 私钥）----
    ssl_certificate     /etc/nginx/ssl/evenstar.love.pem;
    ssl_certificate_key /etc/nginx/ssl/evenstar.love.key;

    # ---- TLS 基本加固 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 上传图片单张 ≤5MB，留余量
    client_max_body_size 10m;

    # SPA 前端路由回退：找不到文件就交给 Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，避免引用到已被替换的旧 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 API 同域反代
    # 注意：proxy_pass 末尾不要加 "/"，否则会剥掉 /api 前缀导致 404
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 本地文件存储兜底（OSS 关闭时才用得到）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ============ ③ 8080 端口：过渡期明文入口（内容与改造前完全一致）============
# 确认 https://evenstar.love 稳定后，可整段删除，并在 compose 里去掉了 8080 映射
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
