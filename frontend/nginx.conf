# ===== nginx.conf（服务器使用）=====
# 放置位置：服务器上复制到 /etc/nginx/conf.d/evenstar.conf 后执行：
#   sudo cp nginx.conf /etc/nginx/conf.d/evenstar.conf
#   sudo systemctl restart nginx
#
# 目录约定（与部署手册一致）：
#   前端 dist  → /var/www/evenstar/dist
#   后端容器   → 映射宿主端口 8081（见 Dockerfile 注释里的 docker run）
#
# 访问方式：
#   备案前：http://服务器IP:8080
#   备案后：加 server_name evenstar.love + 443 证书（见文件末尾注释）

server {
    # 备案前用高位端口 8080，避开备案对 80 端口的约束
    listen 8080;
    server_name _;          # 通配：IP 或任意域名都命中此站点

    root /var/www/evenstar/dist;
    index index.html;

    # 上传图片大小放宽（文章封面/正文图 ≤5MB，留余量）
    client_max_body_size 10m;

    # SPA 前端路由回退：找不到文件就返回 index.html（由 Vue Router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 同域反代（Go 容器映射在宿主机 8081）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # 静态资源缓存（assets 带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

