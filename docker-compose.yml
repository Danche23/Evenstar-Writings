# ===== Evenstar Writings · 全容器化编排 =====
# 放置位置：服务器项目根目录 /var/www/evenstar/docker-compose.yml
#
# 常用命令（都在项目根目录执行）：
#   docker compose build                # 构建 web / backend 两个镜像
#   docker compose up -d mysql redis    # 先起数据库
#   docker compose up -d backend web    # 导入数据后再起应用
#   docker compose ps                   # 看状态
#   docker compose logs -f backend      # 看后端日志
#   docker compose down                 # 停止（⚠️ 千万不要加 -v，会删掉数据卷）
#
# 架构：只有 web 对外暴露 8080，backend/mysql/redis 全留在内部网络
# 隔离：本文件所在目录就是隔离边界，容器/网络/卷名都带 evenstar_ 前缀，与别的项目互不干扰
# 密钥：容器级密钥放同目录 .env（chmod 600，禁止提交）
# 挂载：加 :z 是为兼容 CentOS/RHEL 的 SELinux（未开 SELinux 时无副作用）
#
# 内存上限（1.6G 小机器的保险）：
#   web 64m + backend 256m + mysql 640m + redis 96m ≈ 1.03G
#   任何单个容器发疯，最多吃掉自己那份，不会波及整台服务器
#
# 环境变量取值规则（重要）：
#   - 带 ${XXX:-默认值} 的：.env 里没定义就用默认值，不会报警告
#   - 敏感项（JWT/邮件/OSS/Captcha）在 .env 里没定义 → 传给容器的是空串
#     → 后端 pkg/config/loader.go 判断 val != "" 才覆盖，空串等于"不覆盖"
#     → 于是后端自动使用 backend/configs/config.yaml 里的真实值（本项目采用的方式）
#   - 想改用环境变量管理密钥时，只要往 .env 里补上对应键名即可，无需改本文件

services:
  web:
    build: ./frontend
    image: evenstar-web:1.0
    container_name: evenstar-web
    restart: unless-stopped
    # 内存上限：Nginx 托管静态文件，极省
    mem_limit: 64m
    ports:
      - "80:80"        # HTTP：全部 301 跳转到 https://evenstar.love
      - "443:443"      # HTTPS 主入口（备案通过后启用）
      - "8080:8080"    # 过渡期：IP:8080 明文入口，确认稳定后可删除
    volumes:
      # nginx 站点配置改为「挂载」：以后改配置只需 restart web，不用重建镜像
      - ./frontend/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro,z
      # SSL 证书目录（evenstar.love.pem + evenstar.love.key），只读挂载
      - ./ssl:/etc/nginx/ssl:ro,z
    depends_on:
      - backend
    networks:
      - evenstar

  backend:
    build: ./backend
    image: evenstar-backend:1.0
    container_name: evenstar-backend
    restart: unless-stopped
    # 内存上限：Go 服务平时 30-60M，给足余量
    mem_limit: 256m
    environment:
      # 数据库地址走 compose 服务名（覆盖 config.yaml 里的 localhost）
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 以下键名严格对应 backend/pkg/config/loader.go 的 os.Getenv
      # 未在 .env 定义时传空串 = 不覆盖 = 用 config.yaml 的值
      JWT_SECRET: ${JWT_SECRET:-}
      APP_MODE: ${APP_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      MAIL_MOCK: ${MAIL_MOCK:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_FROM_ADDR: ${MAIL_FROM_ADDR:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      CAPTCHA_ACCESS_KEY_ID: ${CAPTCHA_ACCESS_KEY_ID:-}
      CAPTCHA_ACCESS_KEY_SECRET: ${CAPTCHA_ACCESS_KEY_SECRET:-}
      CAPTCHA_SCENE_ID: ${CAPTCHA_SCENE_ID:-}
      EVENSTAR_ADMIN_USERNAME: ${EVENSTAR_ADMIN_USERNAME:-}
      EVENSTAR_ADMIN_EMAIL: ${EVENSTAR_ADMIN_EMAIL:-}
      EVENSTAR_ADMIN_PASSWORD: ${EVENSTAR_ADMIN_PASSWORD:-}
    volumes:
      # 真实配置（含密钥）不入镜像，运行时挂进来；只读防止误改
      - ./backend/configs:/app/configs:ro,z
      # 日志目录：容器内没有这个目录，必须挂载宿主机可写目录兜底
      - ./data/backend/logs:/app/logs:z
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evenstar
    # ⚠️ 必须单实例：进程内含「每 5 分钟浏览量回写 MySQL」定时任务，无选主机制。
    #    严禁 docker compose up --scale backend=2

  mysql:
    image: mysql:8.0
    container_name: evenstar-mysql
    restart: unless-stopped
    # 内存上限：最吃内存的服务（缓冲池 256M + 其他开销约 400-550M）
    mem_limit: 640m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 1.6G 小机器：压住内存占用（performance_schema 默认会吃几百 MB）
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-evenstar}
    volumes:
      # 具名卷：容器删了重建数据仍在；反向地说，删这个卷 = 删库
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - evenstar

  redis:
    image: redis:7-alpine
    container_name: evenstar-redis
    restart: unless-stopped
    # 内存上限：只存浏览量/限流计数，很小
    mem_limit: 96m
    environment:
      # 官方 redis 镜像不读 REDIS_PASSWORD 环境变量，密码必须写进 command
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - evenstar

networks:
  evenstar:
    name: evenstar_net
    driver: bridge

volumes:
  mysql_data:
    name: evenstar_mysql_data
  redis_data:
    name: evenstar_redis_data
